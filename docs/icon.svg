<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="seo-audit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <!-- One soft pass of light, not a gloss: macOS 26 icons have depth from
         layering rather than from a plastic highlight. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- The squircle macOS actually uses, not a rounded rectangle. -->
  <path fill="url(#bg)" d="M512 32c204 0 306 0 383 77s77 179 77 403-0 306-77 383-179 77-383 77-306 0-383-77-77-179-77-383 0-326 77-403S308 32 512 32z"/>
  <path fill="url(#sheen)" d="M512 32c204 0 306 0 383 77s77 179 77 403-0 306-77 383-179 77-383 77-306 0-383-77-77-179-77-383 0-326 77-403S308 32 512 32z"/>

  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- The lens, and the trend inside it: what the tool looks for, and what
         finding it is for. -->
    <circle cx="446" cy="440" r="212" stroke-width="56"/>
    <path d="M356 500 L424 432 L486 486 L566 384" stroke-width="46"/>
    <path d="M508 372 L574 372 L574 438" stroke-width="46"/>
    <path d="M604 604 L822 822" stroke-width="76"/>
  </g>
</svg>
