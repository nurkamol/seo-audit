<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-label="Example terminal output">
  <rect width="860" height="430" rx="10" fill="#12151c"/>
  <rect width="860" height="34" rx="10" fill="#1b1f29"/><rect y="24" width="860" height="10" fill="#1b1f29"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/><circle cx="39" cy="17" r="5.5" fill="#febc2e"/><circle cx="58" cy="17" r="5.5" fill="#28c840"/>
  <text x="430" y="21" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#6b7280">seo-audit</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">
    <text x="22" y="62" fill="#7dd3fc">$ <tspan fill="#e5e7eb">npx github:nurkamol/seo-audit@v1 https://example.com</tspan></text>
    <text x="22" y="94" fill="#9ca3af">  crawling https://example.com …</text>
    <text x="22" y="126" fill="#e5e7eb" font-weight="700">  https://example.com</text>
    <text x="22" y="146" fill="#6b7280">  42 pages · 60 requests · 3.9s · 18 ignored</text>
    <text x="22" y="182" fill="#f87171">  ✗ <tspan fill="#e5e7eb" font-weight="700">Link to a page that does not exist</tspan> <tspan fill="#6b7280">×4</tspan></text>
    <text x="22" y="201" fill="#6b7280">    /journal/iskusstvo-chuvstvovat-glubzhe/ — linked from /ru/journal/…</text>
    <text x="22" y="220" fill="#6b7280">    · https://example.com/ru/journal/iskusstvo-chuvstvovat-glubzhe/</text>
    <text x="22" y="252" fill="#fbbf24">  ! <tspan fill="#e5e7eb" font-weight="700">hreflang is not reciprocal</tspan></text>
    <text x="22" y="271" fill="#6b7280">    Google drops one-way pairs.</text>
    <text x="22" y="303" fill="#fbbf24">  ! <tspan fill="#e5e7eb" font-weight="700">Thin page</tspan> <tspan fill="#6b7280">×4</tspan></text>
    <text x="22" y="322" fill="#6b7280">    126 words. Under ~300 rarely ranks for anything competitive.</text>
    <text x="22" y="354" fill="#7dd3fc">  · <tspan fill="#e5e7eb" font-weight="700">Nothing links to this page</tspan></text>
    <text x="22" y="373" fill="#6b7280">    In the sitemap, but no page links to it.</text>
    <text x="22" y="405" fill="#f87171">  1 error  <tspan fill="#fbbf24">6 warning</tspan>  <tspan fill="#7dd3fc">2 note</tspan></text>
  </g>
</svg>
