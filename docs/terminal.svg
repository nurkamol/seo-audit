<svg xmlns="http://www.w3.org/2000/svg" width="880" height="446" viewBox="0 0 880 446" role="img" aria-label="Example terminal output">
  <rect width="880" height="446" rx="10" fill="#12151c"/>
  <rect width="880" height="34" rx="10" fill="#1b1f29"/><rect y="24" width="880" height="10" fill="#1b1f29"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/><circle cx="39" cy="17" r="5.5" fill="#febc2e"/><circle cx="58" cy="17" r="5.5" fill="#28c840"/>
  <text x="440" y="21" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#6b7280">seo-audit</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="22" y="62" fill="#7dd3fc">$ <tspan fill="#e5e7eb">npx github:nurkamol/seo-audit@v1 https://example.com</tspan></text>
    <text x="22" y="92" fill="#9ca3af">  crawling https://example.com …</text>
    <text x="22" y="122" fill="#e5e7eb" font-weight="700">  https://example.com</text>
    <text x="22" y="141" fill="#6b7280">  31 pages · 71 requests · 12.9s</text>

    <text x="22" y="175" fill="#f87171">  ✗ <tspan fill="#e5e7eb" font-weight="700">No &lt;h1&gt;</tspan> <tspan fill="#6b7280">×17</tspan></text>
    <text x="22" y="193" fill="#6b7280">    The page has no headline.</text>
    <text x="22" y="211" fill="#6b7280">    · https://example.com/teacher-trainings/</text>
    <text x="22" y="229" fill="#6b7280">    · https://example.com/schedule/</text>

    <text x="22" y="261" fill="#f87171">  ✗ <tspan fill="#e5e7eb" font-weight="700">Sitemap URL redirects</tspan></text>
    <text x="22" y="279" fill="#6b7280">    301 → /summer-offer/. A sitemap should list final URLs only.</text>

    <text x="22" y="311" fill="#fbbf24">  ! <tspan fill="#e5e7eb" font-weight="700">og:image is WebP</tspan> <tspan fill="#6b7280">×17</tspan></text>
    <text x="22" y="329" fill="#6b7280">    LinkedIn does not render WebP previews, WhatsApp is unreliable.</text>

    <text x="22" y="361" fill="#fbbf24">  ! <tspan fill="#e5e7eb" font-weight="700">Nothing links to this page</tspan> <tspan fill="#6b7280">×2</tspan></text>
    <text x="22" y="379" fill="#6b7280">    In the sitemap, but no page links to it.</text>

    <text x="22" y="421" fill="#f87171">  20 error  <tspan fill="#fbbf24">91 warning</tspan>  <tspan fill="#7dd3fc">12 note</tspan></text>
  </g>
</svg>
