[package]
name = "seo-audit"
version = "1.34.0"
description = "Crawl a site's sitemap and check every page, from a window"
authors = ["Nurkamol Vakhidov"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Only to hand a failure message to the fallback page safely — a reason with a
# quote in it must not become a syntax error inside an eval.
serde_json = "1"

[profile.release]
# The shell is a few thousand lines around a webview; none of this is hot, and
# all of it is downloaded by somebody on a metered connection.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
