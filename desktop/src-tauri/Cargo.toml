[package]
name = "seo-audit"
version = "1.35.0"
description = "Crawl a site's sitemap and check every page, from a window"
authors = ["Nurkamol Vakhidov"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native message dialogs. The shell owns no UI of its own and this is how it
# stays that way while still being able to say "there is a new version".
tauri-plugin-dialog = "2"
# Only to hand a failure message to the fallback page safely — a reason with a
# quote in it must not become a syntax error inside an eval.
serde_json = "1"

# Windows only, and for one thing: tying the engine's lifetime to this
# process's at the OS level. See `tie_to_our_lifetime` in main.rs.
[target.'cfg(windows)'.dependencies]
# Three features for two symbols, none of them guessable from the names:
# JOBOBJECT_EXTENDED_LIMIT_INFORMATION is behind Win32_System_Threading, and
# CreateJobObjectW is behind Win32_Security because it takes a
# SECURITY_ATTRIBUTES pointer. Both are only wrong on Windows, which is the one
# platform the machine writing this cannot compile for — so they were found by
# reading the crate's source rather than by another round trip through CI.
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
# The shell is a few thousand lines around a webview; none of this is hot, and
# all of it is downloaded by somebody on a metered connection.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
