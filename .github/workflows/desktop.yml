# The Tauri shell, built for the platforms the macOS app does not ship to.
#
# Each runner builds with its own Node, because `desktop/scripts/prepare.mjs`
# bundles `process.execPath`. That is deliberate: cross-compiling a runtime is a
# way to ship a binary nobody ran, and `setup-node` already pins the version.
#
# Not attached to a release yet — this proves the bundles build and leaves them
# as artifacts. Wiring them to a tag is the last phase.
name: Desktop shell

on:
  push:
    branches: [main]
    # The shell wraps the engine, so a change to either can break a bundle.
    paths:
      - 'desktop/**'
      - 'bin/**'
      - 'src/**'
      - 'worker/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'bin/**'
      - 'src/**'
      - 'worker/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform failing should not hide whether the others work — the
      # whole point of this job is finding out which ones do.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # Cargo's registry and the build directory, which is most of the minutes.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Tauri draws with the system webview, which on Linux is one that has to
      # be installed. 22.04 for webkit2gtk-4.1, which is what Tauri v2 wants.
      - name: What Tauri needs on Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      # Before any cargo command, not just the build. Tauri's build script
      # validates `externalBin` at compile time, so `cargo test` on an unstaged
      # tree fails with "resource path binaries/node-… doesn't exist" — which is
      # how this job failed the first time it ran.
      #
      # It stages a Node and the engine, then starts the staged copy and waits
      # for it to announce a port. The first bundle shipped without `worker/`
      # and produced an app that opened, started nothing and waited; a list of
      # directories is exactly the kind of thing that looks right and is not.
      - name: Stage the engine, and prove it runs
        working-directory: desktop
        run: node scripts/prepare.mjs

      - name: The shell's own tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Bundle
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: What came out
        shell: bash
        run: |
          find desktop/src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*-setup.exe' \) \
            -exec ls -lh {} \; || true

      # --- Does the thing we just built actually run? ----------------------
      # Building a bundle proves it bundles. The macOS build proved something
      # else entirely — it opened, started nothing and waited, because a
      # directory the engine imports had not been copied. These two platforms
      # cannot be run on the machine this was written on, so they are run here.

      - name: What went into the Linux packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          echo "── deb ──"
          dpkg --contents desktop/src-tauri/target/release/bundle/deb/*.deb \
            | grep -E 'usr/(bin|lib)' | head -20

      - name: Install it, run it, and watch for the engine
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y xvfb
          sudo dpkg -i desktop/src-tauri/target/release/bundle/deb/*.deb \
            || sudo apt-get -f install -y

          app="$(command -v seo-audit || true)"
          test -n "$app" || { echo "::error::the package installed no runnable binary"; exit 1; }
          echo "installed at $app"

          # The shell narrates its startup here, because a windowed app that
          # fails has nowhere else to say why.
          export SEO_AUDIT_SHELL_LOG="$RUNNER_TEMP/shell.log"

          xvfb-run -a "$app" &

          # The engine is a child process announcing a port. Waiting for it is
          # the only proof that the whole chain works: bundle, sidecar,
          # resources, spawn.
          started=""
          for _ in $(seq 1 40); do
            if pgrep -f 'seo-audit.mjs --serve' >/dev/null; then started=1; break; fi
            sleep 1
          done
          if [ -z "$started" ]; then
            echo "::error::the app started and its engine never did"
            echo "── what the shell said ──"; cat "$SEO_AUDIT_SHELL_LOG" 2>/dev/null || echo "(nothing)"
            pkill -f "$app" || true
            exit 1
          fi
          echo "the engine came up"
          cat "$SEO_AUDIT_SHELL_LOG" 2>/dev/null || true

          # And it goes away again. A server that outlives the window holding
          # its port is a bug this project has already shipped once.
          #
          # The app itself, not the xvfb wrapper around it — killing the wrapper
          # left the app running, and then reported the engine as having
          # outlived a window that was still open.
          pkill -f "$app" || true
          for _ in $(seq 1 15); do
            pgrep -f 'seo-audit.mjs --serve' >/dev/null || { echo "and it stopped with the window"; exit 0; }
            sleep 1
          done
          echo "::error::the engine outlived the window that started it"
          pkill -f 'seo-audit.mjs --serve' || true
          exit 1

      - name: Install it, run it, and watch for the engine
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          # /S is NSIS's silent switch. Tauri's installer defaults to per-user.
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5

          $app = Get-ChildItem -Path "$env:LOCALAPPDATA","$env:ProgramFiles","${env:ProgramFiles(x86)}" `
            -Filter 'seo-audit.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { Write-Error 'the installer put no runnable binary anywhere I looked'; exit 1 }
          Write-Host "installed at $($app.FullName)"
          Write-Host '── what came with it ──'
          Get-ChildItem $app.DirectoryName | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table

          $env:SEO_AUDIT_SHELL_LOG = Join-Path $env:RUNNER_TEMP 'shell.log'
          $shell = Start-Process -FilePath $app.FullName -PassThru
          $started = $false
          foreach ($_ in 1..40) {
            if (Get-Process node -ErrorAction SilentlyContinue) { $started = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $started) {
            Write-Host '── is the app even still running? ──'
            Get-Process -Id $shell.Id -ErrorAction SilentlyContinue | Format-Table Id, ProcessName
            Write-Host '── what the shell said ──'
            if (Test-Path $env:SEO_AUDIT_SHELL_LOG) { Get-Content $env:SEO_AUDIT_SHELL_LOG } else { Write-Host '(nothing)' }
            Stop-Process -Id $shell.Id -Force -ErrorAction SilentlyContinue
            Write-Error 'the app started and its engine never did'
            exit 1
          }
          Write-Host 'the engine came up'
          if (Test-Path $env:SEO_AUDIT_SHELL_LOG) { Get-Content $env:SEO_AUDIT_SHELL_LOG }

          Stop-Process -Id $shell.Id -Force -ErrorAction SilentlyContinue
          foreach ($_ in 1..15) {
            if (-not (Get-Process node -ErrorAction SilentlyContinue)) {
              Write-Host 'and it stopped with the window'; exit 0
            }
            Start-Sleep -Seconds 1
          }
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Error 'the engine outlived the window that started it'
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: seo-audit-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
