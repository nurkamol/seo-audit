# The action auditing a real site on every push — a working example of itself,
# and the only test that exercises the composite action end to end.
#
# fail-on: never on purpose. This proves the action runs, not that somebody
# else's site is perfect; gating on their findings would paint this repository
# red for reasons outside it. Projects auditing their own site should gate —
# see the README.
name: self-check
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: seo
        with:
          url: https://fitculturepilates.com
          limit: 15
          fail-on: never
      - name: Show what it found
        run: |
          echo "errors:   ${{ steps.seo.outputs.errors }}"
          echo "warnings: ${{ steps.seo.outputs.warnings }}"
          echo "pages:    ${{ steps.seo.outputs.pages }}"
          test -s seo-audit.html || { echo "no HTML report produced"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit
          path: seo-audit.html
